<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Skill Sphere</title>
<style>
:root{--bg:#f6f3ee;--ink:#1d1c1a;--mute:#76716a;--card:#fff;--line:#e4dfd7;--accent:#1f6f5c;--accent-ink:#fff;--miss:#b4532a}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--ink:#f1eee8;--mute:#9a958c;--card:#1e1d1b;--line:#2e2c29;--accent:#5fc3a8;--accent-ink:#0d1f1a;--miss:#e58a62}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
h1{font-size:22px;letter-spacing:-.01em;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 22px}
button,.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font:600 17px/1 inherit;padding:16px 20px;border-radius:14px;width:100%;display:block;text-align:center;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
input[type=file]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0}
.status{color:var(--mute);text-align:center;margin:18px 0}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.stage{position:relative;border-radius:16px;overflow:hidden;background:#000}
video{width:100%;display:block;max-height:62vh;background:#000}
.cap{position:absolute;left:10px;right:10px;bottom:12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.72);color:#fff;font-size:17px;line-height:1.35;opacity:0;transition:opacity .25s;pointer-events:none}
.cap.on{opacity:1}
.sum{display:flex;gap:10px;flex-wrap:wrap}
.sum div{flex:1 1 40%}.sum b{display:block;font-size:26px;letter-spacing:-.02em}.sum span{color:var(--mute);font-size:14px}
.row{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.t{color:var(--mute);font-variant-numeric:tabular-nums;min-width:48px}
.k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.err{color:var(--miss)}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:22px 4px 6px}
</style>
</head>
<body>
<main>
  <h1>Skill Sphere</h1>
  <p class="sub">Film a few swings. Your coach watches and says very little.</p>

  <label class="btn" id="pick">Record or choose a video<input id="file" type="file" accept="video/*"></label>
  <div class="status" id="status"></div>
  <div class="bar" id="barwrap" hidden><i id="bar"></i></div>

  <section id="result" hidden>
    <div class="stage"><video id="v" playsinline controls></video><div class="cap" id="cap"></div></div>
    <div class="card sum" id="sum"></div>
    <h2>What was said</h2>
    <div class="card" id="says"></div>
    <details class="card" id="all"><summary id="allh" style="cursor:pointer;font-weight:600"></summary><div id="swings"></div></details>
    <button class="ghost" id="again">Another video</button>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let token=params.get('t');
try{ if(token) localStorage.setItem('sphere_token',token); else token=localStorage.getItem('sphere_token'); }catch(e){}
const NAME=a=>a.replace(/^tennis_/,'').replace(/_/g,' ');
let result=null, said=-1, speaking=true;

$('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) send(f); e.target.value=''; });
$('again').onclick=()=>{ $('result').hidden=true; $('pick').hidden=false; $('status').textContent=''; speechSynthesis.cancel(); };

function send(file){
  $('pick').hidden=true; $('result').hidden=true; $('status').className='status';
  $('status').textContent='Sending the video…'; $('barwrap').hidden=false; $('bar').style.width='0';
  const x=new XMLHttpRequest();
  x.open('POST','/coach?only=tennis');
  x.setRequestHeader('X-Token',token||'');
  x.upload.onprogress=e=>{ if(e.lengthComputable) $('bar').style.width=(100*e.loaded/e.total)+'%'; };
  x.upload.onload=()=>{ $('bar').style.width='100%'; $('status').textContent='Watching your swings… this takes a little while.'; };
  x.onload=()=>{
    $('barwrap').hidden=true;
    let d; try{ d=JSON.parse(x.responseText);}catch(e){ d={error:'The coach sent something unexpected.'}; }
    if(x.status!==200||d.error) return fail(d.error||('Error '+x.status));
    show(file,d);
  };
  x.onerror=()=>fail('Could not reach the coach. Is the server running and your phone on the same Wi-Fi?');
  x.send(file);
}
function fail(m){ $('barwrap').hidden=true; $('status').className='status err'; $('status').textContent=m; $('pick').hidden=false; }

function show(file,d){
  result=d; said=-1;
  $('status').textContent=''; $('result').hidden=false;
  const v=$('v'); v.src=URL.createObjectURL(file); v.load();
  const count={}; d.attempts.forEach(a=>count[a.activity]=(count[a.activity]||0)+1);
  const parts=Object.entries(count).map(([k,n])=>`<div><b>${n}</b><span>${NAME(k)}${n>1?'s':''}</span></div>`);
  parts.push(`<div><b>${d.events.length}</b><span>thing${d.events.length==1?'':'s'} said</span></div>`);
  $('sum').innerHTML=parts.join('');
  $('says').innerHTML=d.events.length?d.events.map((e,i)=>`<div class="row" data-t="${e.t}"><span class="t">${fmt(e.t)}</span><div><div class="k">${e.kind}</div>${esc(e.text)}</div></div>`).join(''):'<span style="color:var(--mute)">Nothing needed saying. No habit repeated often enough to be worth interrupting.</span>';
  $('allh').textContent='Every swing ('+d.attempts.length+')';
  $('swings').innerHTML=d.attempts.map(a=>{
    const miss=Object.entries(a.objectives).filter(([,v])=>v.status==='missed').map(([k])=>k.replace(/_/g,' '));
    return `<div class="row" data-t="${a.start}"><span class="t">${fmt(a.start)}</span><div><div class="k">${NAME(a.activity)}</div>${miss.length?`<span style="color:var(--miss)">${miss.join(', ')}</span>`:'nothing flagged'}</div></div>`;
  }).join('');
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{ v.currentTime=+r.dataset.t; v.play(); window.scrollTo({top:0,behavior:'smooth'}); });
  window.scrollTo({top:0});
}
const v=$('v'), cap=$('cap');
v.addEventListener('timeupdate',()=>{
  if(!result) return; const t=v.currentTime;
  const ev=result.events;
  if(said>=0 && ev[said] && t<ev[said].t-0.3) said=-1;      // moved back: allow the cues to be said again
  ev.forEach((e,i)=>{ if(i>said && t>=e.t && t<e.t+1.2){ said=i; if(e.kind!=='principle') speak(e.text); } });
  const cur=ev.filter(e=>t>=e.t&&t<e.t+4.5).pop();
  cap.textContent=cur?cur.text:''; cap.classList.toggle('on',!!cur);
});
v.addEventListener('seeking',()=>{ speechSynthesis.cancel(); });
function speak(text){ try{ const u=new SpeechSynthesisUtterance(text); u.rate=1.0; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }
function fmt(s){ s=Math.round(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
if(!token) $('status').textContent='Open this page with the link the server printed (it contains your token).';
</script>
</body>
</html>
